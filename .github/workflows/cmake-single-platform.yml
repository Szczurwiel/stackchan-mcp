name: Build StackChan Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Prepare Config
        working-directory: ./firmware
        run: |
          if [ -f config.h.example ]; then cp config.h.example src/config.h; fi
          if [ -f src/config.h.example ]; then cp src/config.h.example src/config.h; fi

      - name: Build Firmware and Filesystem Image
        working-directory: ./firmware
        run: |
          pio run -e m5stack-cores3
          pio run -e m5stack-cores3 --target buildfs

      - name: Upload Binaries Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-firmware-binaries
          path: |
            firmware/.pio/build/**/firmware.bin
            firmware/.pio/build/**/spiffs.bin
            firmware/.pio/build/**/partitions.bin
            firmware/.pio/build/**/bootloader.bin
