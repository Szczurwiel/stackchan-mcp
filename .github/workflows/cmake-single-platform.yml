name: Build StackChan Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Prepare Config
        working-directory: ./firmware
        run: |
          if [ -f config.h.example ]; then cp config.h.example src/config.h; fi
          if [ -f src/config.h.example ]; then cp src/config.h.example src/config.h; fi

      - name: Build Firmware and Filesystem Image
        working-directory: ./firmware
        run: |
          pio run -e m5stack-cores3
          pio run -e m5stack-cores3 --target buildfs

      - name: Merge all binaries into a single file
        working-directory: ./firmware
        run: |
          BOOTLOADER=$(find .pio/build/m5stack-cores3 -name "bootloader.bin" | head -n 1)
          PARTITIONS=$(find .pio/build/m5stack-cores3 -name "partitions.bin" | head -n 1)
          FIRMWARE=$(find .pio/build/m5stack-cores3 -name "firmware.bin" | head -n 1)
          LITTLEFS=$(find .pio/build/m5stack-cores3 -name "littlefs.bin" | head -n 1)
          if [ -z "$LITTLEFS" ]; then
            LITTLEFS=$(find .pio/build/m5stack-cores3 -name "spiffs.bin" | head -n 1)
          fi
          
          # Skrypt odczytujący adres pamięci dla buziek prosto ze zbudowanej tabeli partycji
          cat << 'EOF' > get_offset.py
          import sys, struct
          with open(sys.argv[1], "rb") as f: data = f.read()
          for i in range(0, len(data), 32):
              if data[i:i+2] != b'\x50\xaa': continue
              label = data[i+12:i+28].rstrip(b'\x00').decode('ascii', errors='ignore')
              if label in ('spiffs', 'littlefs', 'vfs', 'fs'):
                  offset = struct.unpack('<I', data[i+4:i+8])[0]
                  print(hex(offset))
                  sys.exit(0)
          print("0x000000")
          EOF
          
          FS_OFFSET=$(python get_offset.py $PARTITIONS)
          echo "Znalazłem adres systemu plików: $FS_OFFSET"
          
          # Magia: łączenie wszystkich 4 plików w 1 za pomocą esptool
          esptool.py --chip esp32s3 merge_bin -o FULL_STACKCHAN.bin \
            0x0 $BOOTLOADER \
            0x8000 $PARTITIONS \
            0x10000 $FIRMWARE \
            $FS_OFFSET $LITTLEFS

      - name: Upload Unified Binary
        uses: actions/upload-artifact@v4
        with:
          name: gotowy-plik-do-wgrania
          path: firmware/FULL_STACKCHAN.bin
